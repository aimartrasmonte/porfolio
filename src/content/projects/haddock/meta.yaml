software: [MaxSurf Suite, SolidWorks, Bambu Studio]
pdf: projects/haddock/TFE_Trasmonte_Domenech_Aimar_GETI.pdf
model3d: projects/haddock/haddock-compressed.glb
# (opcional) aspecte del model 3D. Treu les línies que no vulguis.
modelStyle:
  opacity: 0.4 # 1 = opac · 0.3 = molt translúcid
  # color: '#dfe6ee' # força un color a tot el model (treu les textures)
  edges: true # dibuixa les arestes vives
  # edgeColor: '#123778' # per defecte, el blau del web
  # edgeColorDark: '#ff6233' # en mode fosc; per defecte, el taronja del web
  edgeAngle: 30 # graus: més alt = menys arestes (només les més marcades)
  tangentEdges: true # línies de tangència (entre cares que s'uneixen suaument)
  tangentOpacity: 0.6 # 1 = tan marcades com les arestes · 0.15 = molt suaus
draft: false
